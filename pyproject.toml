[project]
name = "karaoke-subs"
version = "0.1.0"
description = "Word-by-word Japanese karaoke subtitles for anime, with literal English glosses"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
keywords = ["anime", "japanese", "karaoke", "subtitles", "forced-alignment", "language-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Education",
]
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy",
    "soundfile",
    "pysubs2",
    "fugashi",
    "unidic-lite",
    "silero-vad",
]

[project.urls]
Homepage = "https://github.com/Villa2389/karaoke-subs"
Issues = "https://github.com/Villa2389/karaoke-subs/issues"

[project.scripts]
karaoke = "karaoke.cli:main"

[project.optional-dependencies]
separation = [
    "audio-separator[cpu]>=0.39",
    "audioread",  # librosa 1.0 no longer pulls it in, audio-separator still imports it
]
anthropic = [
    "anthropic>=1.15.0",
]

# CUDA 12.8 builds on Windows and Linux (they also run on machines without an NVIDIA GPU, on the
# CPU); macOS gets the regular PyPI build (CPU / Apple silicon).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/karaoke"]
